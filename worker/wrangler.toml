# Cloudflare Worker für den Chat-Helfer der Einkaufsliste.
# Wird automatisch per GitHub-Workflow (.github/workflows/chat-helfer.yml) veröffentlicht.
name = "mama-einkauf-helfer"
main = "src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Nur Anfragen von der App sind erlaubt (Komma-getrennt)
ALLOWED_ORIGINS = "https://blomska.github.io"
# Hier holt der Helfer die aktuellen Angebote und Rezepte
DATA_URL = "https://blomska.github.io/Mama-Einkauf/data/"
