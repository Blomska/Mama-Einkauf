# Holt täglich die aktuellen Prospekte & Angebote (Aldi Nord, Marktkauf
# Nientied Lüdinghausen) und veröffentlicht die App auf GitHub Pages.
#
# Einmalig einrichten: GitHub → Settings → Pages → Source: "GitHub Actions"
name: Prospekte aktualisieren & veröffentlichen

on:
  push:
    branches: [main, ccr-a6e722a0-k5p30p]
  schedule:
    - cron: '17 4 * * *'    # täglich ca. 5–6 Uhr deutscher Zeit
    - cron: '17 15 * * *'   # täglich ca. 16–17 Uhr (Marktkauf-Folgewoche ab Donnerstag)
  workflow_dispatch:        # manuell: Actions → "Run workflow"
    inputs:
      nur_rezepte:
        description: 'Nur Rezepte erstellen (Prospekt-Auswertung überspringen, spart Gemini-Kontingent)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Prospekte & Angebote abrufen
        run: node scripts/update-prospekte.mjs
        continue-on-error: true   # bei Ausfall: zuletzt gespeicherte Daten nutzen

      # Zwischenspeicher für KI-Ergebnisse: Gemini wird nur gefragt, wenn sich
      # Prospekt oder Angebote geändert haben (spart Kosten).
      - name: KI-Zwischenspeicher laden
        uses: actions/cache@v4
        with:
          path: .ki-cache
          key: ki-cache-${{ github.run_id }}
          restore-keys: ki-cache-

      # Neue Gemini-Anfragen nur zu den festen Zeiten bzw. bei manuellem Start.
      # Bei Code-Uploads (push) werden nur die zwischengespeicherten Ergebnisse
      # übernommen – das schont das kostenlose Kontingent für den Küchenhelfer.
      - name: KI – Marktkauf-Produkte & Rezepte der Woche
        run: node scripts/ki-auswertung.mjs
        continue-on-error: true
        timeout-minutes: 12
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINIAPIKEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          KI_NUR_REZEPTE: ${{ inputs.nur_rezepte && '1' || '' }}
          KI_OFFLINE: ${{ github.event_name == 'push' && '1' || '' }}

      - name: Webseite zusammenstellen
        run: |
          mkdir -p _site
          # Alle App-Dateien (*.js im Hauptordner) mitnehmen, damit neue Dateien nicht vergessen werden
          cp -r index.html style.css ./*.js manifest.json .nojekyll icons data _site/
          # Sicherheitsnetz: Jede Datei, die die App lädt, muss im Paket sein – sonst bleibt die App bei „Verbinde …“ hängen
          for f in $(grep -ohE "from '\./[^']+'" _site/*.js | sed -E "s/from '\.\/(.*)'/\1/" | sort -u); do
            if [ ! -f "_site/$f" ]; then echo "::error::$f fehlt im Paket"; exit 1; fi
          done

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Eigener Schritt wie in der GitHub-Vorlage: Das Veröffentlichen im selben
  # Job fand das hochgeladene Paket öfter nicht ("No artifacts named github-pages").
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
